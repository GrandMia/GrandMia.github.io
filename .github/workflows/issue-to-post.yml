name: Issue to Hugo Post
on:
  issues:
    types: [opened, edited, labeled, unlabeled]

jobs:
  convert-and-deploy:
    if: contains(github.event.issue.labels.*.name, 'documentation')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate markdown post from issue
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          DATE=$(date +"%Y-%m-%dT%H:%M:%S%z")
          SAFE_TITLE=$(echo "$TITLE" | sed 's/[\/:*?"<>| ]/_/g')
          FILEPATH="content/posts/issue-${ISSUE_NUM}-${SAFE_TITLE}.md"

          cat > "$FILEPATH" <<EOF
---
title: "${TITLE}"
date: ${DATE}
draft: false
tags: ["documentation"]
---
${BODY}
EOF

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      - name: Build site
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
